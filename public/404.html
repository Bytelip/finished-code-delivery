<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgroSpace Nexus</title>
    <script>
      // Single Page Application redirect script for GitHub Pages / Static Hosting
      // Preserves path and query strings across page reloads
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body>
    <div style="background:#050912;color:#38bdf8;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">
      Redirecting to AgroSpace Nexus...
    </div>
  </body>
</html>
