<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="256" cy="256" r="240" fill="#050912" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Orbital Ring -->
  <ellipse cx="256" cy="256" rx="210" ry="80" transform="rotate(-30 256 256)" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="16 10" stroke-opacity="0.5"/>
  
  <!-- Left Solar Array -->
  <g transform="rotate(-30 256 256)">
    <rect x="70" y="236" width="110" height="40" rx="4" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <line x1="106" y1="236" x2="106" y2="276" stroke="#050912" stroke-width="2"/>
    <line x1="142" y1="236" x2="142" y2="276" stroke="#050912" stroke-width="2"/>
    <line x1="70" y1="256" x2="180" y2="256" stroke="#050912" stroke-width="2"/>
    <!-- Solar Mount Bar -->
    <line x1="180" y1="256" x2="215" y2="256" stroke="#94a3b8" stroke-width="4"/>
  </g>

  <!-- Right Solar Array -->
  <g transform="rotate(-30 256 256)">
    <rect x="332" y="236" width="110" height="40" rx="4" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <line x1="368" y1="236" x2="368" y2="276" stroke="#050912" stroke-width="2"/>
    <line x1="404" y1="236" x2="404" y2="276" stroke="#050912" stroke-width="2"/>
    <line x1="332" y1="256" x2="442" y2="256" stroke="#050912" stroke-width="2"/>
    <!-- Solar Mount Bar -->
    <line x1="297" y1="256" x2="332" y2="256" stroke="#94a3b8" stroke-width="4"/>
  </g>

  <!-- Central Satellite Body -->
  <g transform="rotate(-30 256 256)">
    <rect x="215" y="226" width="82" height="60" rx="10" fill="#0f172a" stroke="url(#satGrad)" stroke-width="4" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="16" fill="#10b981" fill-opacity="0.8"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>
  </g>

  <!-- Antenna Dish & Radiator -->
  <g transform="rotate(-30 256 256)">
    <path d="M 236 226 Q 256 195 276 226 Z" fill="#38bdf8" fill-opacity="0.4" stroke="#38bdf8" stroke-width="3"/>
    <line x1="256" y1="200" x2="256" y2="180" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="256" cy="180" r="4" fill="#38bdf8"/>
    <!-- Sensor Optics Aperture -->
    <path d="M 240 286 L 272 286 L 266 312 L 246 312 Z" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <ellipse cx="256" cy="312" rx="10" ry="3" fill="#10b981"/>
  </g>
</svg>
